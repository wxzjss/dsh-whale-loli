# 用 npm Trusted Publishing (OIDC) 发布，不需要任何长期密钥。
#
# 触发方式：推一个形如 v0.2.0 的 tag。
#   git tag v0.2.0 && git push origin v0.2.0
#
# 前置条件（在 npmjs.com 上配一次）：
#   包 → Settings → Trusted publishing，绑定本仓库与 workflow 文件名 release.yml，
#   并勾选允许 publish。或本地跑一次：
#     npm trust github dsh-whale-loli --repo wxzjss/dsh-whale-loli \
#       --file release.yml --allow-publish --yes
#
# 要点（踩过的坑）：
#   · 必须给 job 加 `id-token: write`，否则拿不到 OIDC token。
#   · npm CLI 必须 >= 11.5.1。Node 22 自带 npm 10，会在 registry 返回 404
#     （那条 404 在撒谎：它实际含义是「我不知道你是谁」，不是「包不存在」），
#     所以这里显式把 npm 升到 12，并打印版本以便排查。
#   · workflow 文件名必须与 npm 上登记的一字不差（含 .yml）。
#   · repository.url 必须与仓库对得上，否则 E422。
#   · 源码仓库是公开的，可以带 provenance；这里不显式传 --provenance，
#     让 npm 自己判断（显式传会强制开启，私有仓库时会 422）。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # 保险：确保 npm CLI 高于 Trusted Publishing 的门槛 11.5.1
      - name: Ensure npm supports OIDC trusted publishing
        run: |
          npm install -g npm@^12
          node --version
          npm --version

      # 发布前把仓库里已有的校验脚本全跑一遍，不绿就不发。
      # 说明：verify-patch / real-loader / composition 需要宿主自带的库，
      # CI 里没装 DSH，它们会打印 [skip] 并 exit 0（这是预期行为，不是失败）；
      # 不依赖 DSH 的检查（记忆隔离、冒烟、workflow 结构）在 CI 里会真跑。
      - name: Verify bundle patch, presets and memory isolation
        run: |
          node build-patch.mjs
          git diff --exit-code cordis.patch.yml
          node verify-patch.mjs cordis.patch.yml
          node verify-real-loader.mjs cordis.patch.yml
          node verify-composition.mjs
          node verify-runs.mjs
          node verify-history-window.mjs
          node verify-memory-injection.mjs
          node verify-memory-tool.mjs
          node verify-memory-isolation.mjs
          node verify-memory-rolling.mjs
          node verify-memory-archive.mjs
          node verify-live-assembly.mjs
          node verify-tool-schema.mjs
          node verify-tool-identity.mjs
          node verify-client.mjs
          node verify-client-contribution.mjs
          node verify-client-discovery.mjs
          node verify-daemon-inject.mjs
          node verify-daemon-status.mjs
          node verify-daemon-service.mjs
          node verify-client-gateway-access.mjs
          node verify-host-ledger.mjs
          node verify-row-dispatch.mjs cordis.patch.yml
          node smoke-memory.mjs
          node verify-workflow.mjs

      # 单独把「CI 里必须真跑、不许静默跳过」的那几个再确认一次：
      # 它们靠退出码说话，这里额外断言没有出现 [skip]，防止哪天悄悄退化成空转。
      - name: Assert DSH-independent checks actually ran
        run: |
          out="$(node verify-memory-isolation.mjs 2>&1)"
          echo "$out"
          echo "$out" | grep -q "RESULT: PASS"
          if echo "$out" | grep -q "\[skip\]"; then
            echo "::error::verify-memory-isolation 在 CI 里被跳过了，但它不该跳过"
            exit 1
          fi
          smoke="$(node smoke-memory.mjs 2>&1)"
          echo "$smoke"
          echo "$smoke" | grep -q "SMOKE OK"
          rolling="$(node verify-memory-rolling.mjs 2>&1)"
          echo "$rolling"
          echo "$rolling" | grep -q "RESULT: PASS"
          if echo "$rolling" | grep -q "\[skip\]"; then
            echo "::error::verify-memory-rolling 在 CI 里被跳过了，但它不该跳过"
            exit 1
          fi
          # 超 80 条必须真的归档并瘦身，否则文件会无限长、archive/ 永远空
          arch="$(node verify-memory-archive.mjs 2>&1)"
          echo "$arch"
          echo "$arch" | grep -q "RESULT: PASS"
          # 这条最关键：证明记忆真的进得了模型看到的提示（变量通道），
          # 而独立 section 会被 complete:true 丢掉 —— 防止哪天又退回死路。
          inject="$(node verify-memory-injection.mjs 2>&1)"
          echo "$inject"
          echo "$inject" | grep -q "RESULT: PASS"
          echo "$inject" | grep -q "变量通道成立"
          # 插件真的能加载、配置自洽（防止导出名对不上这类整包加载失败）
          runs="$(node verify-runs.mjs 2>&1)"
          echo "$runs"
          echo "$runs" | grep -q "RESULT: PASS"
          # 写入工具必须存在且真能落盘：只读通道再好，人设写着「每轮都记」
          # 而手里没笔，记忆文件就永远是开天辟地那几条。
          tool="$(node verify-memory-tool.mjs 2>&1)"
          echo "$tool"
          echo "$tool" | grep -q "RESULT: PASS"
          if echo "$tool" | grep -q "\[skip\]"; then
            echo "::error::verify-memory-tool 在 CI 里被跳过了，但它不该跳过"
            exit 1
          fi
          # 历史窗口真的按轮裁剪（不是靠人设文字）
          hw="$(node verify-history-window.mjs 2>&1)"
          echo "$hw"
          echo "$hw" | grep -q "RESULT: PASS"
          # 四个预设装配后各自的记忆都进得了最终提示，而且互不串台
          live="$(node verify-live-assembly.mjs 2>&1)"
          echo "$live"
          echo "$live" | grep -q "RESULT: PASS"
          if echo "$live" | grep -q "\[skip\]"; then
            echo "::error::verify-live-assembly 在 CI 里被跳过了，但它不该跳过"
            exit 1
          fi
          # 发布清单本身自洽（版本号、四个预设、描述里不许漏人）
          lst="$(node verify-listing.mjs 2>&1)"
          echo "$lst"
          echo "$lst" | grep -q "RESULT: PASS"
          # 八个工具的定义互不共享：曾经出过好感度工具拿到记忆文案的事故
          # （宿主把某一份定义按引用摊进了别的预设的请求头），这里用共享表
          # 语义复刻一遍，任何一个描述串台就红。
          ident="$(node verify-tool-identity.mjs 2>&1)"
          echo "$ident"
          echo "$ident" | grep -q "RESULT: PASS"
          # 浏览器半边：设置页 section 能注册、$mount 负载过得了客户端浅校验、
          # 面板渲染得出档位按钮，且全程没有 renderSlot / 裸 JSX / ESM 语句。
          client="$(node verify-client.mjs 2>&1)"
          echo "$client"
          echo "$client" | grep -q "RESULT: PASS"
          # 客户端 contribution 必须过得了 `$mount()` 的全部校验（strict codec /
          # 重复方法 / 命名冲突 / wire 名）。0.9.5 之前面板一直报「远程方法未挂载」，
          # 而宿主日志证明服务活着 —— 失败在浏览器侧，报错只在 devtools 里，
          # 用户和我都看不到。这个脚本把那些校验规则抄下来离线跑，不许静默跳过。
          contrib="$(node verify-client-contribution.mjs 2>&1)"
          echo "$contrib"
          echo "$contrib" | grep -q "RESULT: PASS"
          if echo "$contrib" | grep -q "\[skip\]"; then
            echo "::error::verify-client-contribution 在 CI 里被跳过了，但它不该跳过"
            exit 1
          fi
          # 宿主能不能**发现**客户端 bundle。0.9.1 之前设置页一直看不到「好感度」：
          # 宿主 client-modules 只扫 ctx.loader.entries() 里 specifier 解析得成包的
          # 行，而我们把守护进程写成了 'dsh-whale-loli/affinity-daemon'，它的
          # package.json 解析不到（ERR_PACKAGE_PATH_NOT_EXPORTED），于是 dsh.client
          # 永不被发现，而且宿主**不报任何错**。这里复刻宿主两段判定直接对着
          # profile 安装态跑。
          disc="$(node verify-client-discovery.mjs 2>&1)"
          echo "$disc"
          echo "$disc" | grep -q "RESULT: PASS"
          # 守护进程那一行的 inject 必须能被满足。0.9.2 的故障：inject 里写了
          # 'typert'（只有 dsh-typert-registry 挂载时才有），而用户的 profile 里
          # 没有它 —— cordis 不报错，只是永远 waiting，apply() 一次都不执行，
          # 设置页于是报「远程方法 whale-affinity.status 未挂载」。
          dinj="$(node verify-daemon-inject.mjs 2>&1)"
          echo "$dinj"
          echo "$dinj" | grep -q "RESULT: PASS"
          # 设置页要的数据必须真的齐：`status()` 无论磁盘上有没有值都列全四个
          # 预设，`wired` 不能是空数组（0.9.8 的故障：它去扫一个宿主早就不用的
          # 目录，于是面板只剩「还没有哪个预设挂上好感度」，一个滑块都没有）。
          # 这个脚本只用临时 DSH_HOME，不依赖宿主，所以可以硬要求 PASS。
          dstat="$(node verify-daemon-status.mjs 2>&1)"
          echo "$dstat"
          echo "$dstat" | grep -q "RESULT: PASS"
          # 服务必须在**真实 cordis** 里 strict 可见（网关的判定路径）。0.9.x 的
          # 故障形态是：服务 provide 进表了（loose 查得到），但提供者 fiber 卡在
          # Pending(1)，于是 `ctx.get(serviceKey)` 返回 undefined、网关整行跳过、
          # 界面报「远程方法未挂载」，而宿主一个错都不报。这个脚本同时做反证：
          # apply 抛异常时 strict 查不到。
          # 它需要宿主的 @deepseek-ai/cordis；裸 runner 上拿不到，会打 [skip] 退出 0
          # —— 和 verify-peers 一样，**不能**要求它在这里必须 PASS（0.7.2 与 0.9.4
          # 都是栽在这种「必须有输出」的断言上）。所以只打印，不 grep。
          dsvc="$(node verify-daemon-service.mjs 2>&1)"
          echo "$dsvc"
          # 客户端取命名空间的**唯一**正确姿势：`ctx.inject(['remote.whale-affinity'],
          # child => …)`。直接 `remote['whale-affinity']` 会被 cordis 的 get 陷阱
          # 抛 `cannot get property "remote.whale-affinity" without inject`。
          # 同样要宿主 cordis，裸 runner 上打 [skip]，只打印不 grep。
          gw="$(node verify-client-gateway-access.mjs 2>&1)"
          echo "$gw"
          # 宿主侧账本：能按裸名定位到 bundle、dsh.client 字段齐全、桥接日志活着。
          # 同样依赖本机安装态（profile + ~/.dsh），裸 runner 上会 [skip]，只打印。
          ledg="$(node verify-host-ledger.mjs 2>&1)"
          echo "$ledg"
          # 挂载行分派：记忆行只能注册 whale_memory*、好感度行只能注册 affinity_vN。
          # 0.9.10 及以前 4 条好感度行全落进 applyMemory()，好感度段被塞了记忆正文。
          # 需要宿主的 js-yaml，裸 runner 上打 [skip]，所以只打印不 grep。
          disp="$(node verify-row-dispatch.mjs cordis.patch.yml 2>&1)"
          echo "$disp"
          # 注意：verify-peers 需要 semver（DSH 自带或 npm i -D semver），
          # CI 里两样都没有会打 [skip] 退出 0，所以它**不能**放进这段断言。

      # tag 版本号必须与 package.json 一致，避免发出错版本
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          test "$TAG" = "$PKG"

      # 不传 NODE_AUTH_TOKEN，也不传 --provenance，交给 npm 自己判断
      - name: Publish to npm
        run: npm publish --access public --ignore-scripts
