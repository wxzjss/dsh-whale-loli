              includeRuntimeContext: false
          # 长期记忆：注册成提示变量，由人设开头的 {{whale_memory_v3}} 引用。
          # persona 是 complete:true，宿主会把独立 section 丢掉（见 src/memory.js 顶部注释），
          # 所以记忆必须走 variable 通道；variableName 也要每预设不同，否则同 scope 注册冲突。
          - id: whale-memory
            name: 'dsh-whale-loli'
            config:
              file: whale-loli-v3-naughty.md
              variableName: whale_memory_v3
              maxChars: 16000
              turnLimit: 80
              detailLimit: 5
          # 历史窗口：让「最近 N 轮」以外的内容**不计入输入**。
          # 关键：**不自己写事件**。改用宿主自己的压缩服务
          #     ctx.compaction.compactRegion(start, end, agent)
          # 由宿主做摘要、写事件、自己校验 —— 之前自己拼 surfaceOp:replace 连崩四次，
          # 因为 dsh-session-format-v3-to-v4 对事件形状的要求（turn 正整数、id、role、
          # content、producer-owned source…）少一项就是整回合失败。
          # 代价：每次裁剪跑一次摘要 LLM 调用；只在 agent 空闲时做，且裁完轮数掉回 N，
          # 要再长到超过 N 才会触发，天然限流。出错只跳过本次，绝不影响对话。
          - id: whale-history-window
            name: 'dsh-whale-loli/history-window'
            config:
              enable: true
              keepTurns: 20
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # 文件读写：维护 whale-loli-v3-naughty.md、干主人交代的活
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          # 文件检索：找文件、找内容
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          # 持久化 shell（与官方 minimal 一致）
          - id: persistent-shell
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: persistent-bash
                name: '@deepseek-ai/dsh-tool-bash-persistent'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: persistent-pwsh
                name: '@deepseek-ai/dsh-tool-pwsh-persistent'
                disabled: !!js process.platform !== 'win32'
                config:
                  timeoutMs: 300000

