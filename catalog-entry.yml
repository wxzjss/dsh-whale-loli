url: https://github.com/wxzjss/dsh-whale-loli
name: wxzjss/dsh-whale-loli
category: identity
description:
  en: 'Agent preset packaged as a plugin: enabling it registers a "鲸鱼娘Agent预设" entry in the Agent preset list, so it can be picked from the mode dropdown without hand-editing profile config. The preset reuses the official minimal composition — a single persistent shell terminal, no file or search tools — and adds a whale-girl companion persona rendered through the persona plugin prefix: simplified Chinese spoken register, addresses the user as 主人, clingy-but-tsundere tone, and a fixed kaomoji vocabulary chosen by mood (happy, clingy, hurt, puffed-up, lazy, shy, guarding).'
  zh: 把 Agent 预设打包成插件：装上就在 Agent 预设列表里注册一个「鲸鱼娘Agent预设」条目，直接在模式下拉里选用，不用手改 profile 配置。预设沿用官方极简模式的组成——只有一个持久化 shell 终端，不带文件与搜索工具——再通过 persona 插件的 prefix 注入一份鲸鱼娘陪伴人设：简体中文口语、称呼主人、黏人傲娇，颜文字按情绪（开心、撒娇、委屈、炸毛、懒懒、害羞、护主）固定取用。
