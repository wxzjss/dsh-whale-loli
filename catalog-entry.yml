description:
  en: 'Agent preset packaged as a plugin: installing it registers a "鲸鱼娘Agent预设" (whale-girl) entry in the Agent preset list, selectable from the mode dropdown with no hand-edited config. The preset is the official minimal profile — shell only — plus a whale-girl companion persona: simplified-Chinese spoken register, addresses the user as 主人, clingy-but-tsundere tone, and a fixed kaomoji vocabulary per mood.'
  zh: '把 Agent 预设打包成插件：装上就在 Agent 预设列表里注册一个「鲸鱼娘Agent预设」条目，直接在模式下拉里选用，不用手改配置。预设本体是官方极简模式（只开放 shell）加一份鲸鱼娘陪伴人设：简体中文口语、称呼主人、黏人傲娇、颜文字按情绪固定取用。'
