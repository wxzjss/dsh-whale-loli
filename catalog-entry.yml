url: https://github.com/wxzjss/dsh-whale-loli
name: wxzjss/dsh-whale-loli
category: identity
description:
  en: 'Four agent presets in one plugin, each with its own persistent memory file. Enabling it registers 鲸鱼娘Agent预设, 鲸鱼娘活人版Agent预设, 鲸鱼娘涩涩版Agent预设 and 鲸鱼娘女儿版Agent预设 in the Agent preset list, so any of them can be picked from the mode dropdown without hand-editing profile config. All four reuse the official minimal composition — a single persistent shell terminal — plus file read/write and glob/grep tools. The first pairs that with a whale-girl companion persona (simplified-Chinese spoken register, addresses the user as 主人, clingy-but-tsundere). The second swaps in a "live person" variant that is allowed to talk back, deflect and be cold, and demotes the sweet tone to a seasoning. The third keeps the original persona but makes being affectionate the stated top behavioral drive, reserved for the user alone and dialed down in group chats. The fourth is a daughter variant: she calls the user 爸爸, never 主人, and is written as a bright, curious, clingy child — no pretense of being grown up, no saccharine tone. Each preset reads its own memory file (whale-loli.md, whale-loli-v2-live.md, whale-loli-v3-naughty.md and dsh-whale-daughter.md) through a distinct prompt variable — whale_memory, whale_memory_v2, whale_memory_v3 and whale_memory_v4 — so the four memories never read or write each other. Each preset also registers its own write tool — whale_memory_add, whale_memory_v2_add, whale_memory_v3_add and whale_memory_v4_add — which appends one-line rolling summaries with automatic numbering, the N/80 counter and overflow archiving, so the model can actually keep its own memory current instead of needing hand edits. Conversation compaction is left to the billion-context plugin; this plugin only carries the persona-level rule that compressed summaries count as evidence and that details can be looked up on demand.'
  zh: '一个插件里放四个 Agent 预设，各自带一份互不相通的持久记忆文件。装上就在 Agent 预设列表里注册「鲸鱼娘Agent预设」「鲸鱼娘活人版Agent预设」「鲸鱼娘涩涩版Agent预设」和「鲸鱼娘女儿版Agent预设」，直接在模式下拉里选用，不用手改 profile 配置。四者都沿用官方极简模式的组成——只有一个持久化 shell 终端——再加文件读写与 glob/grep 工具。第一个配的是鲸鱼娘陪伴人设（简体中文口语、称呼主人、黏人傲娇）；第二个换成「活人版」：允许怼人、敷衍、冷淡，甜味降为调味；第三个保留原版人设，但把「黏主人」写成第一行为驱动力，只在主人面前放开，群聊里照旧收着；第四个是女儿版：称呼「爸爸」而绝不叫「主人」，性格天真活泼可爱，好奇心重、话多黏人、没心机，不装成熟也不甜腻。每个预设都通过各自独立的提示变量（whale_memory、whale_memory_v2、whale_memory_v3、whale_memory_v4）读取自己的记忆文件（whale-loli.md、whale-loli-v2-live.md、whale-loli-v3-naughty.md、dsh-whale-daughter.md），四份记忆互不读写；每个预设另配一个专属写入工具（whale_memory_add、whale_memory_v2_add、whale_memory_v3_add、whale_memory_v4_add），负责追加一行摘要、自增编号、维护 N/80 计数并在超限时归档，所以记忆能自己长，不用手改文件。上下文压缩交给 billion-context 插件；本插件只保留人设层的三条约定：压缩摘要也算依据、需要原文时自己去检索、看不到旧原文不等于记忆丢失。'
